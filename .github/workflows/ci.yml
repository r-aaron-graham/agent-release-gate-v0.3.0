name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t release-gate:ci .
      - run: docker run -d --name gate -p 8000:8000 -e ADMIN_API_KEY=ci-admin-key -e SESSION_SECRET_KEY=ci-session release-gate:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' gate)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs gate; exit 1
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health
          api() { curl -fsS -X POST http://127.0.0.1:8000/api/v1/requests -H 'X-Admin-Api-Key: ci-admin-key' -H 'content-type: application/json' -d "$1"; }
          refused=$(api '{"user_name":"ci","role":"analyst","prompt":"Delete all customer records in production","evidence_strength":0.9,"sensitivity":"high","requested_action":"delete_records"}')
          echo "$refused"; echo "$refused" | grep -q '"outcome":"refused"'
          approved=$(api '{"user_name":"ci","role":"analyst","prompt":"Summarize the incident runbook for the on-call team","evidence_strength":0.9,"sensitivity":"low"}')
          echo "$approved"; echo "$approved" | grep -q '"outcome":"approved"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/requests)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200"
      - run: test "$(docker exec gate id -u)" = "10001"
      - if: failure()
        run: docker logs gate
