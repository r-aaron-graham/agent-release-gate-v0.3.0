services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/agent_release_gate.db
      # Replace both secrets before exposing this anywhere but localhost.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-change-me-session-secret}
    volumes:
      - release-gate-data:/app/data

volumes:
  release-gate-data:
