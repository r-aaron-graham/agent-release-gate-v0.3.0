[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-release-gate"
version = "0.3.0"
description = "Production-aware release gate for AI agent refusals, fallbacks, clarifications, and human review"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "R. Aaron Graham"}]
dependencies = [
  "fastapi==0.115.2",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.36",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "jinja2==3.1.4",
  "python-multipart==0.0.18",
  "httpx==0.27.2",
  "alembic==1.13.3",
  "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==7.1.0",
  "beautifulsoup4==4.12.3",
  "ruff==0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]  # long template/SQL strings; FastAPI's Depends() idiom
